name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build
        env:
          # The build never connects to these; they only satisfy configuration checks.
          MONGODB_URI: mongodb://127.0.0.1:27017/ci
          AUTH_SECRET: ci-only-not-a-real-secret-0000
          NEXT_TELEMETRY_DISABLED: "1"
